<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page not found — CodeFont</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <style>
        :root {
            --color-surface-page: #F9FAFB;
            --color-surface-raised: #FFFFFF;
            --color-text-primary: #111827;
            --color-text-secondary: #4B5563;
            --color-border: #E5E7EB;
            --color-brand: #6B46C1;
            --color-action: #FDE047;
            --color-action-hover: #FACC15;
            --color-action-ink: #111827;
            --font-ui: system-ui, -apple-system, "Segoe UI", sans-serif;
            --text-meta: 0.875rem;
            --radius-card: 12px;
            --shadow-rest: 0 1px 3px rgba(17, 24, 39, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-surface-page);
            color: var(--color-text-primary);
            font-family: var(--font-ui);
            line-height: 1.6;
        }

        main {
            width: 100%;
            max-width: 560px;
            padding: clamp(28px, 6vw, 48px);
            background: var(--color-surface-raised);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-rest);
            text-align: center;
        }

        .code {
            margin: 0 0 16px;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
            font-size: var(--text-meta);
            color: var(--color-brand);
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(1.75rem, 1.35rem + 1.7vw, 2.5rem);
            line-height: 1.15;
        }

        p {
            margin: 0 0 24px;
            color: var(--color-text-secondary);
        }

        .zh {
            display: block;
            margin-top: 4px;
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            justify-content: center;
            align-items: center;
        }

        a {
            color: var(--color-brand);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        a:focus-visible {
            outline: 3px solid var(--color-brand);
            outline-offset: 3px;
            border-radius: 4px;
        }

        .home {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            background: var(--color-action);
            color: var(--color-action-ink);
        }

        .home:hover {
            background: var(--color-action-hover);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>
            The page you asked for does not exist or has moved.
            <span class="zh" lang="zh-CN">你要找的页面不存在或已移动。</span>
        </p>
        <nav aria-label="Helpful links">
            <a class="home" href="/">Home</a>
            <a href="/fonts">Font gallery</a>
            <a href="/best-coding-fonts">Best coding fonts</a>
            <a href="/best-coding-fonts-cn" hreflang="zh-CN" lang="zh-CN">编程字体推荐</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/privacy">Privacy</a>
            <a href="/terms">Terms</a>
        </nav>
    </main>
</body>
</html>
